name: Update oil prices

on:
  schedule:
    # UTC 22:00 = 北京时间次日 06:00
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-oil-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices
        env:
          OIL_API_ID: ${{ secrets.OIL_API_ID }}
          OIL_API_KEY: ${{ secrets.OIL_API_KEY }}
        run: python update_prices.py

      - name: Commit updated data.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f data.js ]; then DATA=data.js
          elif [ -f site/data.js ]; then DATA=site/data.js
          elif [ -f docs/data.js ]; then DATA=docs/data.js
          else DATA=data.js
          fi

          git add "$DATA"
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: auto update oil prices"
            git push
          fi
